# Checks only - deployment is Vercel's GitHub integration (production on push to main, a preview
# per PR/branch), so nothing here publishes anything.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # tsc -b && vite build - the same thing Vercel runs
      - run: npm run build

      # fail if there are any lint warnings
      - run: npm run lint -- --max-warnings 0
