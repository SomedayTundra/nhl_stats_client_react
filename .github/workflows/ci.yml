# Checks only - deployment is Vercel's GitHub integration (production on push to main, a preview
# per PR/branch), so nothing here publishes anything.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # tsc -b && vite build - the same thing Vercel runs
      - run: npm run build

      # non-blocking until the existing findings (react-hooks/set-state-in-effect etc.) are fixed;
      # drop continue-on-error once `npm run lint` is clean
      - run: npm run lint
        continue-on-error: true
