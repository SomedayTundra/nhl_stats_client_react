# Drafts patch notes for commits that reached main since the last published notes, and opens (or
# updates) that day's PR from patch-notes/draft-YYYY-MM-DD. GitHub's PR notification email is the
# "a draft is ready" signal. Edit the note in the PR, then merge it to publish. See scripts/draft-patch-notes.mjs.
#
# Needs repo secrets ANTHROPIC_API_KEY and SERVER_REPO_TOKEN (a fine-grained PAT with read-only
# Contents access to nhl_stats_server_fastapi, which is private), plus Settings > Actions >
# General > "Allow GitHub Actions to create and approve pull requests".

name: Patch Notes Draft

on:
  push:
    branches: [main]
    # merging a draft must not draft notes about itself
    paths-ignore: ['patch-notes/**']
  # server-only changes have no client push to ride on; this catches them weekly (Mon 14:00 UTC)
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

# never run two drafts at once, but don't cancel one mid-write either
concurrency:
  group: patch-notes-draft
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      # full history of every branch, so the script can see the open origin/patch-notes/draft-* branches
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          repository: SomedayTundra/nhl_stats_server_fastapi
          token: ${{ secrets.SERVER_REPO_TOKEN }}
          path: .server
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - id: draft
        run: node scripts/draft-patch-notes.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERVER_DIR: .server

      - if: steps.draft.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ steps.draft.outputs.branch }}
          add-paths: ${{ steps.draft.outputs.file }}
          commit-message: '[patch notes] draft ${{ steps.draft.outputs.file }}'
          title: 'Patch notes draft ${{ steps.draft.outputs.date }}'
          body: |
            Drafted from commits on `main` in this repo and `nhl_stats_server_fastapi`.

            Edit `${{ steps.draft.outputs.file }}` here as you like, then merge to publish it.
            More commits on `main` the same day get added to this PR without touching your edits:
            their bullets go under the matching New / Improved / Fixed heading. Commits on a later
            day get their own file and PR instead, whether or not this one has been merged. If this
            day already had published notes, this PR edits that file rather than adding a second one.
          reviewers: ${{ github.repository_owner }}
