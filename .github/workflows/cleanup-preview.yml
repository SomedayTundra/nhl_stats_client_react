# Deletes the Vercel preview deployment(s) for a PR's branch once that PR closes (merged or
# not) - previews are otherwise never cleaned up automatically. Deploys themselves are still
# entirely Vercel's native GitHub integration (see ci.yml); this workflow only calls Vercel's
# REST API to find and delete deployments whose git branch matches the closed PR, so it can
# never touch a production (main) deployment.

name: Cleanup Preview Deployment

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Vercel deployments for this branch
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          ids=$(curl -s \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_TEAM_ID&meta-githubCommitRef=$BRANCH" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | jq -r '.deployments[].uid')

          if [ -z "$ids" ]; then
            echo "No deployments found for branch $BRANCH"
            exit 0
          fi

          for id in $ids; do
            echo "Deleting deployment $id"
            curl -s -X DELETE \
              "https://api.vercel.com/v13/deployments/$id?teamId=$VERCEL_TEAM_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN"
          done
